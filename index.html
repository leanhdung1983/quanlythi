<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hệ thống luyện thi.</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Merriweather:wght@300;400;700&family=Montserrat:wght@700;800;900&display=swap"
    rel="stylesheet">

  <!-- TikZ Rendering (KaTeX is bundled with the application) -->
  <link rel="stylesheet" type="text/css" href="https://tikzjax.com/v1/fonts.css">
  <script src="https://tikzjax.com/v1/tikzjax.js"></script>

  <style>
    #root-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-800 antialiased font-sans">
  <div id="root-loader">
    <div class="spinner"></div>
    <div class="mt-4 text-slate-400 text-[10px] font-bold tracking-[0.2em] uppercase animate-pulse">Initializing
      System...</div>
  </div>

  <div id="root"></div>

  <!-- Script chính đã được di chuyển vào src -->
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
